[workspace]
resolver = "2"
members = [
    "crates/*",
    "plugins/*",
    "examples/cabinet",
    "examples/basic/*",
    "examples/web/*",
    "examples/api/*",
    "examples/realtime/*",
    "examples/net/*",
    "examples/misc/*",
]
exclude = ["ci-smoke-min", "ci-smoke-api", "ci-smoke-web", ".ci-gen"]


[workspace.package]
authors = ["Pavel Kuzmin <Virus191288@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/s00d/sova"
homepage = "https://s00d.github.io/sova/"

[workspace.dependencies]
# Workspace crates (version+path so `cargo publish` can resolve)
sova-core = { version = "0.1.3", path = "crates/sova-core" }
sova = { version = "0.1.9", path = "crates/sova" }
sova-testing = { version = "0.1.2", path = "crates/sova-testing", default-features = false }
sova-activity = { version = "0.1.2", path = "plugins/sova-activity" }
sova-auth = { version = "0.1.5", path = "plugins/sova-auth", default-features = false }
sovax = { version = "0.1.1", path = "plugins/sovax" }
sova-compress = { version = "0.1.1", path = "plugins/sova-compress" }
sova-cookies = { version = "0.1.1", path = "plugins/sova-cookies" }
sova-cors = { version = "0.1.1", path = "plugins/sova-cors" }
sova-csrf = { version = "0.1.2", path = "plugins/sova-csrf" }
sova-db = { version = "0.1.3", path = "plugins/sova-db", default-features = false }
sova-env = { version = "0.1.1", path = "plugins/sova-env" }
sova-http = { version = "0.1.1", path = "plugins/sova-http" }
sova-i18n = { version = "0.1.1", path = "plugins/sova-i18n" }
sova-mail = { version = "0.1.1", path = "plugins/sova-mail" }
sova-meta = { version = "0.1.2", path = "plugins/sova-meta", default-features = false }
sova-notifications = { version = "0.1.3", path = "plugins/sova-notifications" }
sova-observability = { version = "0.1.1", path = "plugins/sova-observability", default-features = false }
sova-openapi = { version = "0.1.1", path = "plugins/sova-openapi" }
sova-passport = { version = "0.1.2", path = "plugins/sova-passport" }
sova-quic = { version = "0.1.1", path = "plugins/sova-quic" }
sova-rate-limit = { version = "0.1.1", path = "plugins/sova-rate-limit" }
sova-redis = { version = "0.1.1", path = "plugins/sova-redis" }
sova-session = { version = "0.1.2", path = "plugins/sova-session" }
sova-shield = { version = "0.1.1", path = "plugins/sova-shield" }
sova-sse = { version = "0.1.1", path = "plugins/sova-sse" }
sova-static = { version = "0.1.1", path = "plugins/sova-static" }
sova-storage = { version = "0.1.1", path = "plugins/sova-storage" }
sova-store = { version = "0.1.1", path = "plugins/sova-store" }
sova-tasks = { version = "0.1.1", path = "plugins/sova-tasks" }
sova-tasks-store = { version = "0.1.1", path = "plugins/sova-tasks-store" }
sova-templates = { version = "0.1.1", path = "plugins/sova-templates" }
sova-udp = { version = "0.1.1", path = "plugins/sova-udp" }
sova-vld = { version = "0.1.3", path = "plugins/sova-vld" }
sova-ws = { version = "0.1.1", path = "plugins/sova-ws" }


# Shared third-party
arc-swap = "1"
argon2 = "0.5"
async-compression = { version = "0.4", features = ["tokio", "gzip", "deflate", "brotli"] }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
cookie = { version = "0.18", features = ["percent-encode"] }
criterion = { version = "0.5", features = ["async_tokio"] }
cron = "0.15"
ctrlc = "3"
dotenvy = "0.15"
file-rotate = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hkdf = "0.12"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1" }
hyper-util = { version = "0.1" }
include_dir = "0.7"
insta = { version = "1", features = ["json", "redactions", "filters"] }
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "pool",
    "tokio1",
    "tokio1-rustls",
    "ring",
    "rustls-platform-verifier",
    "file-transport",
] }
matchit = "0.9"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
mime_guess = "2"
minijinja = "2"
minijinja-autoreload = "2"
multer = "3"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
opendal = { version = "0.58", default-features = true }
opentelemetry = { version = "0.30", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["grpc-tonic", "trace"] }
password-hash = "0.5"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quinn = { version = "0.11", features = ["rustls"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
rcgen = "0.13"
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
sea-orm = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_qs = "0.13"
serde_urlencoded = "0.7"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "registry", "ansi"] }
url = "2"
urlencoding = "2"
vld = { version = "0.4", default-features = true, features = ["serialize"] }
