[package]
name = "ruvo-core"
version = "0.4.0"
edition = "2021"
description = "Core HTTP primitives for Ruvo (App, Router, Request, Response)"
license = "MIT"
publish = false

[features]
testing = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http-body-util = "0.1"
http-body = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
bytes = "1"
mime_guess = "2"
thiserror = "2"
percent-encoding = "2"
matchit = "0.9"
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "net", "time", "io-util"] }
http-body-util = "0.1"
bytes = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "dispatch"
harness = false
