[package]
name = "ruvo-core"
version = "0.4.0"
edition = "2021"
description = "Core HTTP primitives for Ruvo (App, Router, Request, Response)"
license = "MIT"
publish = false

[features]
testing = []
listen-reuseport = ["dep:socket2"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rustls-pki-types", "dep:arc-swap"]
dev-tls = ["tls", "dep:rcgen"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http2", "service"] }
http-body-util = "0.1"
http-body = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
bytes = "1"
mime_guess = "2"
thiserror = "2"
percent-encoding = "2"
matchit = "0.9"
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
socket2 = { version = "0.5", optional = true, features = ["all"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
rustls-pki-types = { version = "1", optional = true }
arc-swap = { version = "1", optional = true }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "net", "time", "io-util"] }
http-body-util = "0.1"
bytes = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "dispatch"
harness = false
