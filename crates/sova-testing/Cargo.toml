[package]
name = "sova-testing"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
description = "Framework-style test harness for Sova (sqlite, acting_as, factories, snapshots)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-testing"
readme = "README.md"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = ["sqlite"]
sqlite = ["sova-db/sqlite"]
auth = ["dep:sova-auth"]
notifications = ["dep:sova-notifications"]

[dependencies]
sova-core = { workspace = true, features = ["testing"] }
sova-db = { workspace = true, default-features = false }
sova-auth = { workspace = true, optional = true }
sova-notifications = { workspace = true, optional = true }
sea-orm = { workspace = true, features = ["macros", "sqlx-sqlite"] }
sea-orm-migration = { workspace = true, features = ["sqlx-sqlite"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true, features = ["json", "redactions", "filters"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
http = { workspace = true }
serde_json = { workspace = true }
sova-auth = { workspace = true }
