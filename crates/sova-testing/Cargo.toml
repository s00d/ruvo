[package]
name = "sova-testing"
version = "0.1.0"
edition = "2021"
description = "Framework-style test harness for Sova (sqlite, TestApp, snapshots)"
license = "MIT"
repository = "https://github.com/s00d/sova"
homepage = "https://s00d.github.io/sova/"
documentation = "https://docs.rs/sova-testing"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = ["sqlite"]
sqlite = ["sova-db/sqlite"]
# Auth / notifications acting helpers live in those plugins' test utils
# (avoids crates.io cycle: testing → auth → testing).

[dependencies]
sova-core = { workspace = true, features = ["testing"] }
sova-db = { workspace = true, default-features = false }
sea-orm = { workspace = true, features = ["macros", "sqlx-sqlite"] }
sea-orm-migration = { workspace = true, features = ["sqlx-sqlite"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true, features = ["json", "redactions", "filters"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
http = { workspace = true }
serde_json = { workspace = true }
