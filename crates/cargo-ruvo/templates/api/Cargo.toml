[package]
name = "{{name}}"
version = "0.1.0"
edition = "2021"

[dependencies]
ruvo = { path = "../crates/ruvo", features = ["cli"] }
ruvo-cookies = { path = "../plugins/ruvo-cookies" }
ruvo-session = { path = "../plugins/ruvo-session" }
ruvo-openapi = { path = "../plugins/ruvo-openapi" }
ruvo-env = { path = "../plugins/ruvo-env" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
