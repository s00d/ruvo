[package]
name = "ruvo"
version = "0.4.0"
edition = "2021"
description = "Express-like HTTP framework for Rust"
license = "MIT"

[features]
default = ["static-files"]
static-files = ["dep:ruvo-static"]
cors = ["dep:ruvo-cors"]
csrf = ["session", "dep:ruvo-csrf"]
shield = ["dep:ruvo-shield"]
cookies = ["dep:ruvo-cookies"]
compress = ["dep:ruvo-compress"]
rate-limit = ["dep:ruvo-rate-limit"]
session = ["cookies", "dep:ruvo-session"]
templates = ["dep:ruvo-templates", "ruvo-i18n?/templates"]
multipart = ["ruvo-core/multipart"]
cli = ["dep:ruvo-cli"]
vld = ["dep:ruvo-vld", "dep:vld"]
openapi = ["dep:ruvo-openapi"]
i18n = ["dep:ruvo-i18n"]
i18n-cookie = ["i18n", "cookies", "ruvo-i18n/cookie"]
ws = ["dep:ruvo-ws"]
store = ["dep:ruvo-store"]
store-file = ["store", "dep:ruvo-store-file"]
store-postgres = ["store", "db", "dep:ruvo-store-postgres"]
store-sqlite = ["store", "dep:ruvo-store-sqlite"]
tasks-store = ["dep:ruvo-tasks-store"]
tasks-file = ["tasks-store", "dep:ruvo-tasks-file"]
tasks-postgres = ["tasks-store", "db", "dep:ruvo-tasks-postgres"]
tasks-sqlite = ["tasks-store", "dep:ruvo-tasks-sqlite"]
tasks = ["tasks-store", "dep:ruvo-tasks"]
udp = ["dep:ruvo-udp"]
quic-udp = ["dep:ruvo-quic"]
sse-feed = ["dep:ruvo-sse"]
env = ["dep:ruvo-env"]
tls = ["ruvo-core/tls"]
dev-tls = ["tls", "ruvo-core/dev-tls"]
store-crypto = ["store", "ruvo-store/store-crypto"]
# vld + DocVldExt sugar (needs both plugins + vld openapi schemas)
vld-openapi = ["vld", "openapi", "ruvo-vld/openapi", "vld/openapi"]
vld-flash = ["vld", "session", "ruvo-vld/flash"]
vld-flash-templates = ["vld-flash", "templates", "ruvo-vld/flash-templates"]
vld-form = ["vld", "multipart", "ruvo-vld/form"]
vld-i18n = ["vld", "i18n", "ruvo-vld/i18n"]
http-client = ["dep:ruvo-http"]
mail = ["dep:ruvo-mail"]
passport = ["dep:ruvo-passport"]
passport-session = ["passport", "session", "ruvo-passport/session"]
passport-jwt = ["passport", "db", "ruvo-passport/jwt"]
passport-oauth = ["passport-jwt", "ruvo-passport/oauth"]
auth = ["passport-session", "passport-jwt", "mail", "db", "dep:ruvo-auth"]
auth-vld = ["auth", "vld", "vld-flash", "vld-form", "ruvo-auth/vld"]
meta = ["dep:ruvo-meta"]
meta-templates = ["meta", "templates", "ruvo-meta/templates"]
meta-i18n = ["meta", "i18n", "ruvo-meta/i18n"]
meta-store = ["meta", "store", "ruvo-meta/store"]
web = [
    "cli",
    "env",
    "cors",
    "cookies",
    "session",
    "csrf",
    "static-files",
    "templates",
    "meta",
    "meta-templates",
    "shield",
]
api = ["cli", "env", "cors", "cookies", "session", "openapi", "vld", "vld-openapi"]
db = ["dep:ruvo-db", "dep:sea-orm"]
testing = ["ruvo-core/testing"]

[dependencies]
ruvo-core = { path = "../ruvo-core" }
sea-orm = { version = "2.0", optional = true, default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
ruvo-static = { path = "../../plugins/ruvo-static", optional = true }
ruvo-cors = { path = "../../plugins/ruvo-cors", optional = true }
ruvo-csrf = { path = "../../plugins/ruvo-csrf", optional = true }
ruvo-shield = { path = "../../plugins/ruvo-shield", optional = true }
ruvo-cookies = { path = "../../plugins/ruvo-cookies", optional = true }
ruvo-session = { path = "../../plugins/ruvo-session", optional = true }
ruvo-compress = { path = "../../plugins/ruvo-compress", optional = true }
ruvo-rate-limit = { path = "../../plugins/ruvo-rate-limit", optional = true }
ruvo-templates = { path = "../../plugins/ruvo-templates", optional = true }
ruvo-cli = { path = "../../plugins/ruvo-cli", optional = true }
ruvo-vld = { path = "../../plugins/ruvo-vld", optional = true }
ruvo-openapi = { path = "../../plugins/ruvo-openapi", optional = true }
ruvo-i18n = { path = "../../plugins/ruvo-i18n", optional = true }
ruvo-ws = { path = "../../plugins/ruvo-ws", optional = true }
ruvo-store = { path = "../../plugins/ruvo-store", optional = true }
ruvo-store-file = { path = "../../plugins/ruvo-store-file", optional = true }
ruvo-store-postgres = { path = "../../plugins/ruvo-store-postgres", optional = true }
ruvo-store-sqlite = { path = "../../plugins/ruvo-store-sqlite", optional = true }
ruvo-tasks-store = { path = "../../plugins/ruvo-tasks-store", optional = true }
ruvo-tasks-file = { path = "../../plugins/ruvo-tasks-file", optional = true }
ruvo-tasks-postgres = { path = "../../plugins/ruvo-tasks-postgres", optional = true }
ruvo-tasks-sqlite = { path = "../../plugins/ruvo-tasks-sqlite", optional = true }
ruvo-tasks = { path = "../../plugins/ruvo-tasks", optional = true }
ruvo-udp = { path = "../../plugins/ruvo-udp", optional = true }
ruvo-quic = { path = "../../plugins/ruvo-quic", optional = true }
ruvo-sse = { path = "../../plugins/ruvo-sse", optional = true }
ruvo-env = { path = "../../plugins/ruvo-env", optional = true }
ruvo-db = { path = "../../plugins/ruvo-db", optional = true }
ruvo-http = { path = "../../plugins/ruvo-http", optional = true }
ruvo-mail = { path = "../../plugins/ruvo-mail", optional = true }
ruvo-passport = { path = "../../plugins/ruvo-passport", optional = true }
ruvo-auth = { path = "../../plugins/ruvo-auth", optional = true }
ruvo-meta = { path = "../../plugins/ruvo-meta", optional = true }
vld = { version = "0.4", optional = true, default-features = true, features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
http-body-util = "0.1"
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"

