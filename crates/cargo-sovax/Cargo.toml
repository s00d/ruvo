[package]
name = "cargo-sovax"
version = "0.1.0"
edition = "2021"
description = "Cargo subcommand for scaffolding and running Sova apps"
license = "MIT"
repository = "https://github.com/s00d/sova"
homepage = "https://s00d.github.io/sova/"
documentation = "https://s00d.github.io/sova/guide/cargo-sovax"
keywords = ["sova", "cargo-subcommand", "web", "scaffold"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
readme = "README.md"
include = [
  "src/**/*",
  "templates/**/*",
  "README.md",
  "Cargo.toml",
]

[[bin]]
name = "cargo-sovax"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
include_dir = { workspace = true }
notify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
ctrlc = { workspace = true }
