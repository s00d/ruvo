[package]
name = "bench_loaded"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bench_loaded"
path = "src/main.rs"

[dependencies]
ruvo = { workspace = true, features = ["cors", "cookies", "session", "rate-limit"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
