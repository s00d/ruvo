[package]
name = "ws_chat"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ws_chat"
path = "src/main.rs"

[dependencies]
ruvo = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tracing = { workspace = true }
