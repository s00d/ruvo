[package]
name = "ws_chat"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ws_chat"
path = "src/main.rs"

[dependencies]
ruvo = { path = "../../../crates/ruvo", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
tracing = "0.1"
