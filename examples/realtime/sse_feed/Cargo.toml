[package]
name = "sse_feed"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "sse_feed"
path = "src/main.rs"

[dependencies]
sova = { workspace = true, features = ["sse-feed"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tracing = { workspace = true }
