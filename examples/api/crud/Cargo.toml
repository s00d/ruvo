[package]
name = "crud"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "crud"
path = "src/main.rs"

[dependencies]
ruvo = { path = "../../../crates/ruvo", features = ["db", "vld", "env"] }
ruvo-env = { path = "../../../plugins/ruvo-env" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
async-trait = "0.1"
