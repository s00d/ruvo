[package]
name = "api_oauth"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "api_oauth"
path = "src/main.rs"

[dependencies]
ruvo = { workspace = true, features = ["passport-oauth", "env", "cli"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
