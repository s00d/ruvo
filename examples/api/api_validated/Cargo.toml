[package]
name = "api_validated"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "api_validated"
path = "src/main.rs"

[dependencies]
ruvo = { workspace = true, features = ["vld-openapi"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
http = { workspace = true }
tracing = { workspace = true }
