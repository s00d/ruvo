[package]
name = "api_validated"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "api_validated"
path = "src/main.rs"

[dependencies]
ruvo = { path = "../../../crates/ruvo", features = ["vld-openapi"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
http = "1"
tracing = "0.1"
