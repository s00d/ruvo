{% extends "layout.html" %}
{% block content %}
<div id="vue-auth" class="mx-auto max-w-md">
  <h1 class="font-display text-3xl font-semibold text-mist-100">{{ t("auth.register") }}</h1>
  <p v-if="error" class="mt-3 text-sm text-red-300" v-text="error"></p>
  <form
    class="mt-6 grid gap-4 rounded-xl border border-white/10 bg-ink-800/50 p-5 shadow-lg shadow-black/20"
    @submit="submit"
  >
    <label class="grid gap-1.5 text-sm text-mist-300">
      {{ t("auth.name") }}
      <input class="rounded-md border border-white/10 bg-ink-950 px-3 py-2 text-mist-100 outline-none ring-tide-400/40 focus:ring-2" name="name" required>
    </label>
    <label class="grid gap-1.5 text-sm text-mist-300">
      {{ t("auth.email") }}
      <input class="rounded-md border border-white/10 bg-ink-950 px-3 py-2 text-mist-100 outline-none ring-tide-400/40 focus:ring-2" name="email" type="email" required>
    </label>
    <label class="grid gap-1.5 text-sm text-mist-300">
      {{ t("auth.password") }}
      <input class="rounded-md border border-white/10 bg-ink-950 px-3 py-2 text-mist-100 outline-none ring-tide-400/40 focus:ring-2" name="password" type="password" minlength="8" required>
    </label>
    <button
      type="submit"
      class="mt-1 rounded-md bg-tide-500 px-4 py-2.5 font-semibold text-ink-950 transition hover:bg-tide-400 disabled:opacity-50"
      :disabled="busy"
    >{{ t("auth.register") }}</button>
  </form>
  <p class="mt-4 text-sm text-mist-400">
    <a class="text-tide-400 underline-offset-2 hover:underline" href="/login">{{ t("auth.have_account") }}</a>
  </p>
</div>
{% endblock %}
{% block scripts %}
<script>
RuvoAuth.mount("#vue-auth", {
  data() {
    return { error: "", busy: false };
  },
  methods: {
    async submit(e) {
      e.preventDefault();
      this.busy = true;
      this.error = "";
      try {
        await RuvoAuth.api.post("/register", RuvoAuth.formFields(e.target));
        location.href = "/cabinet";
      } catch (err) {
        this.error = RuvoAuth.errorMessage(err);
        this.busy = false;
      }
    },
  },
});
</script>
{% endblock %}
