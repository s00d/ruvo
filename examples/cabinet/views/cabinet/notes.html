{% extends "layout.html" %}
{% block content %}
<h1 class="font-display text-3xl font-semibold text-mist-100">{{ t("nav.notes") }}</h1>

<form
  method="post"
  action="/cabinet/notes"
  enctype="multipart/form-data"
  class="mt-6 grid max-w-lg gap-4 rounded-xl border border-white/10 bg-ink-800/50 p-5"
>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="grid gap-1.5 text-sm text-mist-300">
    {{ t("notes.title") }}
    <input
      class="rounded-md border border-white/10 bg-ink-950 px-3 py-2 text-mist-100 outline-none ring-tide-400/40 focus:ring-2"
      name="title"
      required
    >
  </label>
  <label class="grid gap-1.5 text-sm text-mist-300">
    {{ t("notes.body") }}
    <textarea
      class="rounded-md border border-white/10 bg-ink-950 px-3 py-2 text-mist-100 outline-none ring-tide-400/40 focus:ring-2"
      name="body"
      rows="4"
    ></textarea>
  </label>
  <button
    type="submit"
    class="rounded-md bg-tide-500 px-4 py-2.5 font-semibold text-ink-950 transition hover:bg-tide-400"
  >{{ t("notes.create") }}</button>
</form>

<ul class="mt-8 space-y-3">
  {% for n in notes %}
    <li class="rounded-xl border border-white/10 bg-ink-800/40 px-4 py-3">
      <strong class="text-mist-100">{{ n.title }}</strong>
      <p class="mt-1 text-mist-400">{{ n.body }}</p>
      <form method="post" action="/cabinet/notes/delete" enctype="multipart/form-data" class="mt-3">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="id" value="{{ n.id }}">
        <button
          type="submit"
          class="rounded border border-red-400/30 px-2.5 py-1 text-sm text-red-300 transition hover:bg-red-950/40"
        >{{ t("notes.delete") }}</button>
      </form>
    </li>
  {% else %}
    <li class="text-mist-500">{{ t("cabinet.no_notes") }}</li>
  {% endfor %}
</ul>
{% endblock %}
