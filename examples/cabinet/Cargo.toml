[package]
name = "cabinet"
version = "0.1.0"
edition = "2021"
publish = false
description = "Ruvo kitchen-sink demo: Fortify auth, cabinet, Postgres notes + identity"

[[bin]]
name = "cabinet"
path = "src/main.rs"

[dependencies]
ruvo = { workspace = true, features = [
    "web",
    "store-sql",
    "session-sql",
    "tasks",
    "tasks-sql",
    "vld-flash-templates",
    "vld-form",
    "multipart",
    "rate-limit",
    "compress",
    "i18n",
    "i18n-cookie",
    "ws",
    "http-client",
    "mail-templates",
    "storage",
    "auth-vld",
    "auth-activity",
    "notifications-auth",
    "notifications-ws",
    "notifications-templates",
    "openapi",
    "vld-openapi",
    "cli",
    "env",
    "meta-store",
    "observability",
] }
sea-orm = { workspace = true, default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
sea-orm-migration = { workspace = true, default-features = false, features = [
    "runtime-tokio-rustls",
] }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
tracing = { workspace = true }
http = { workspace = true }
urlencoding = { workspace = true }
