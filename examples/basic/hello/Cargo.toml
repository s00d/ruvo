[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hello"
path = "src/main.rs"

[dependencies]
ruvo = { path = "../../../crates/ruvo", features = ["static-files", "cors", "cookies"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
