[package]
name = "raw_echo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "raw_echo"
path = "src/main.rs"

[dependencies]
ruvo = { path = "../../../crates/ruvo" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
