[package]
name = "devtools_demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "devtools_demo"
path = "src/main.rs"

[dependencies]
sova = { workspace = true, features = ["web", "devtools", "http-client"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tracing = { workspace = true }
