[package]
name = "templates"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "templates"
path = "src/main.rs"

[dependencies]
ruvo = { path = "../../../crates/ruvo", features = ["templates"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
