[package]
name = "templates"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "templates"
path = "src/main.rs"

[dependencies]
ruvo = { workspace = true, features = ["templates"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
