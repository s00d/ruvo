[package]
name = "quic_udp_echo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "quic_udp_echo"
path = "src/main.rs"

[dependencies]
ruvo = { path = "../../../crates/ruvo", features = ["quic-udp", "tls"] }
ruvo-quic = { path = "../../../plugins/ruvo-quic" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
bytes = "1"
