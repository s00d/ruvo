[package]
name = "quic_udp_echo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "quic_udp_echo"
path = "src/main.rs"

[dependencies]
ruvo = { workspace = true, features = ["quic-udp", "tls"] }
ruvo-quic = { path = "../../../plugins/ruvo-quic" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
bytes = { workspace = true }
