# Template Compose for a Sova *application* repository.
# Copy deploy/* into your app root (or keep them under ./deploy and set context).
#
# Default layout after copy-to-root:
#   Dockerfile
#   docker-compose.yml
#   sova.toml
#   .env
#   Cargo.toml
#   src/

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Must match your Cargo [[bin]] / package name:
        APP_BIN: myapp
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      SOVA_ENV: production
      RUST_LOG: info
      # DATABASE_URL: postgres://sova:sova@db:5432/sova
    volumes:
      - ./sova.toml:/app/sova.toml:ro
    restart: unless-stopped
    # depends_on:
