services:
  app:
    # Published demo: https://github.com/s00d/sova/pkgs/container/sova-hello
    # `compose pull` uses the image; `compose up --build` rebuilds from this repo.
    image: ghcr.io/s00d/sova-hello:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        EXAMPLE_PKG: hello
        EXAMPLE_BIN: hello
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      SOVA_ENV: production
      RUST_LOG: info
    volumes:
      - ./sova.production.toml:/app/sova.toml:ro
    restart: unless-stopped
