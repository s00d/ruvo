name: docs

permissions:
  contents: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'crates/sova-docs-gen/**'
      - 'crates/sova-core/src/plugin.rs'
      - 'crates/sova/Cargo.toml'
      - 'crates/sova/src/doc_features.rs'
      - 'plugins/**'
      - 'package.json'
      - '.github/workflows/docs.yml'

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate docs from sources
        run: cargo run -q -p sova-docs-gen

      - name: Install docs dependencies
        run: pnpm -C docs install --frozen-lockfile

      - name: Build VitePress site
        env:
          SOVA_DOCS_BASE: /sova/
        run: pnpm -C docs build

      - name: Add nojekyll
        run: touch docs/.vitepress/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs/.vitepress/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
