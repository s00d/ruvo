name: docs

permissions:
  contents: write

on:
  # Disabled until docs site is ready for auto-publish.
  # Uncomment push/release to deploy on every docs change / release.
  workflow_dispatch:
  # push:
  #   branches: [master]
  #   paths:
  #     - 'docs/**'
  #     - 'crates/**'
  #     - 'plugins/**'
  #     - 'Cargo.toml'
  # release:
  #   types: [published]

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh generated docs (fail if out of date)
        run: cargo run -q -p ruvo-docs-gen -- --check

      - name: Install docs dependencies
        run: pnpm -C docs install --frozen-lockfile

      - name: Build VitePress site
        env:
          RUVO_DOCS_BASE: /ruvo/
        run: pnpm -C docs build

      - name: Add nojekyll
        run: touch docs/.vitepress/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs/.vitepress/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
