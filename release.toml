# cargo-release configuration (mirrors s00d/vld)
# Install:
#   cargo install cargo-release
#
# crates.io rate-limits ~5 NEW crates per ~10 minutes on first publish.
# Publish one crate at a time (or batches of ≤5), wait when rate-limited.
#
# === First-time publish order (foundations → test harness → leaves → facade) ===
#
#   cargo publish -p sova-core
#   cargo publish -p sovax
#   cargo publish -p sova-cookies
#   cargo publish -p sova-cors
#   cargo publish -p sova-shield
#   # …session / csrf / db / …
#   cargo publish -p sova-testing   # BEFORE plugins that list it in [dev-dependencies]
#   # …activity / auth / notifications / …
#   # …then facade `sova`
#
# sova-testing may depend on auth/notifications once those crates exist on crates.io.

# `cargo-sovax` / `sova-docs-gen` stay publish = false.
# In-app CLI helpers: crate `sovax`. Scaffolding binary: `cargo-sovax` → `cargo sovax`.
#
# After all crates exist:
#   cargo release patch --workspace --execute

sign-commit = false
sign-tag = false

push = true
push-remote = "origin"

tag = true
tag-prefix = "v"
tag-name = "{{prefix}}{{version}}"
consolidate-commits = true
tag-message = "Release {{crate_name}} v{{version}}"

pre-release-commit-message = "chore: release v{{version}}"

verify = true
publish = true
allow-branch = ["master", "main"]
dependent-version = "upgrade"
