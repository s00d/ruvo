# cargo-release configuration (mirrors s00d/vld)
# Install:
#   cargo install cargo-release
#
# crates.io rate-limits ~5 NEW crates per ~10 minutes on first publish.
# Publish one crate at a time (or batches of ≤5), wait when rate-limited.
#
# === First-time publish order (foundations → leaves → dependents → facade) ===
#
#   cargo publish -p sova-core
#   # wait for index
#   cargo publish -p sova_cookies
#   cargo publish -p sova_cors
#   cargo publish -p sova_shield
#   cargo publish -p sova-compress
#   # …then session/csrf/db/… then facade
#
# NOTE: facade crate name `sova` and old `sova-cli` are taken on crates.io.
# Console helpers ship as `sovax`. Rename the facade before publishing it.
#
# After all crates exist:
#   cargo release patch --workspace --execute

sign-commit = false
sign-tag = false

push = true
push-remote = "origin"

tag = true
tag-prefix = "v"
tag-name = "{{prefix}}{{version}}"
consolidate-commits = true
tag-message = "Release {{crate_name}} v{{version}}"

pre-release-commit-message = "chore: release v{{version}}"

verify = true
publish = true
allow-branch = ["master", "main"]
dependent-version = "upgrade"
