[package]
name = "ruvo-http"
version = "0.4.0"
edition = "2021"
description = "Outbound HTTP client bound to request deadline and tracing"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures-util = { workspace = true, default-features = false, features = ["std"] }
tracing = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
url = { workspace = true }
toml = { workspace = true, default-features = false, features = ["parse"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
ruvo-core = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
http = { workspace = true }
