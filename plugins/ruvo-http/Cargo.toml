[package]
name = "ruvo-http"
version = "0.1.0"
edition = "2021"
description = "Outbound HTTP client bound to request deadline and tracing"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-http"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
ruvo-core = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures-util = { workspace = true, default-features = false, features = ["std"] }
tracing = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
url = { workspace = true }
toml = { workspace = true, default-features = false, features = ["parse"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
ruvo-core = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
http = { workspace = true }
