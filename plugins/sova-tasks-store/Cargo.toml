[package]
name = "sova-tasks-store"
version = "0.1.3"
authors.workspace = true
edition.workspace = true
description = "TaskStore trait + memory / file / sql / redis backends"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-tasks-store"
readme = "README.md"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = ["unstable-store"]
unstable-store = []
file = ["tokio/fs", "tokio/io-util", "dep:serde", "dep:serde_json"]
sql = ["dep:sova-db", "dep:chrono", "dep:sea-orm"]
redis = ["dep:sova-redis", "dep:serde", "dep:serde_json", "dep:redis", "dep:base64"]

[dependencies]
bytes = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sova-db = { workspace = true, optional = true, default-features = false }
sova-redis = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
redis = { workspace = true, optional = true, features = ["script"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
sova-db = { workspace = true, default-features = false, features = ["sqlite"] }
