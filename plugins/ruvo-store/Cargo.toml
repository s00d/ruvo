[package]
name = "ruvo-store"
version = "0.1.0"
edition = "2021"
description = "KvStore trait + memory / file / sql / redis backends for Ruvo"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-store"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = ["unstable-store"]
unstable-store = []
store-crypto = ["dep:chacha20poly1305", "dep:hkdf", "dep:hmac", "dep:sha2", "dep:rand", "dep:base64"]
file = ["tokio/fs", "tokio/io-util"]
sql = ["dep:ruvo-db", "dep:chrono", "dep:sea-orm"]
redis = ["dep:ruvo-redis", "dep:redis"]

[dependencies]
bytes = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ruvo-db = { workspace = true, optional = true, default-features = false }
ruvo-redis = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
redis = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
ruvo-db = { workspace = true, default-features = false, features = ["sqlite"] }
