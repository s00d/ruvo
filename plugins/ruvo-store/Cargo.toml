[package]
name = "ruvo-store"
version = "0.4.0"
edition = "2021"
description = "KvStore trait + memory backend for Ruvo (sessions, cache, rate-limit incr)"
license = "MIT"
publish = false

[features]
default = ["unstable-store"]
unstable-store = []
store-crypto = ["dep:chacha20poly1305", "dep:hkdf", "dep:hmac", "dep:sha2", "dep:rand", "dep:base64"]

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
chacha20poly1305 = { version = "0.10", optional = true, features = ["std"] }
hkdf = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
