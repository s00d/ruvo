[package]
name = "ruvo-ws"
version = "0.4.0"
edition = "2021"
description = "WebSocket plugin for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
 hyper = { version = "1", features = ["server", "client", "http2"] }
 hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http2"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
tracing = "0.1"
bytes = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
ruvo-core = { path = "../../crates/ruvo-core", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
