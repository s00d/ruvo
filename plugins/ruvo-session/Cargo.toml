[package]
name = "ruvo-session"
version = "0.4.0"
edition = "2021"
description = "Session plugin for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
ruvo-cookies = { path = "../ruvo-cookies" }
ruvo-store = { path = "../ruvo-store" }
cookie = { version = "0.18", features = ["percent-encode"] }
getrandom = "0.2"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
http = "1"
