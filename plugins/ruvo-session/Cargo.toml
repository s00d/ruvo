[package]
name = "ruvo-session"
version = "0.4.0"
edition = "2021"
description = "Session plugin for Ruvo"
license = "MIT"
publish = false

[features]
default = []
sql = ["dep:ruvo-db", "dep:chrono", "dep:sea-orm", "ruvo-store/sql"]
redis = ["dep:ruvo-redis", "dep:redis"]

[dependencies]
ruvo-core = { workspace = true }
ruvo-cookies = { path = "../ruvo-cookies" }
ruvo-store = { workspace = true }
ruvo-db = { workspace = true, optional = true, default-features = false }
ruvo-redis = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
cookie = { workspace = true, features = ["percent-encode"] }
getrandom = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http = { workspace = true }
ruvo-db = { workspace = true, default-features = false, features = ["sqlite"] }
ruvo-redis = { workspace = true }
sea-orm = { workspace = true }
chrono = { workspace = true }
redis = { workspace = true }
