[package]
name = "sova-store"
version = "0.1.3"
authors.workspace = true
edition.workspace = true
description = "KvStore trait + memory / file / sql / redis / redb backends for Sova"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-store"
readme = "README.md"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = ["unstable-store"]
unstable-store = []
store-crypto = ["dep:chacha20poly1305", "dep:hkdf", "dep:hmac", "dep:sha2", "dep:rand", "dep:base64"]
file = ["tokio/fs", "tokio/io-util"]
sql = ["dep:sova-db", "dep:chrono", "dep:sea-orm"]
redis = ["dep:sova-redis", "dep:redis"]
redb = ["dep:redb"]

[dependencies]
bytes = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sova-core = { workspace = true }
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sova-db = { workspace = true, optional = true, default-features = false }
sova-redis = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
redb = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
sova-db = { workspace = true, default-features = false, features = ["sqlite"] }
