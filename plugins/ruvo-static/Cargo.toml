[package]
name = "ruvo-static"
version = "0.4.0"
edition = "2021"
description = "Static file plugin for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
bytes = "1"
http = "1"
httpdate = "1"
mime_guess = "2"
tokio = { version = "1", features = ["fs", "io-util"] }
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
