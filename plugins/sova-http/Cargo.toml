[package]
name = "sova-http"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
description = "Outbound HTTP client bound to request deadline and tracing"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-http"
readme = "README.md"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
sova-core = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures-util = { workspace = true, default-features = false, features = ["std"] }
tracing = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
url = { workspace = true }
toml = { workspace = true, default-features = false, features = ["parse"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
sova-core = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
http = { workspace = true }
