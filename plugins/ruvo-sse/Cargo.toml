[package]
name = "ruvo-sse"
version = "0.1.0"
edition = "2021"
description = "Server-Sent Events helpers for Ruvo (channels, Last-Event-ID, keep-alive)"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-sse"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
ruvo-core = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true, default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-stream = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
http = { workspace = true }
http-body-util = { workspace = true }
futures-util = { workspace = true, default-features = false, features = ["std"] }
