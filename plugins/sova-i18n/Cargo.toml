[package]
name = "sova-i18n"
version = "0.1.0"
edition = "2021"
description = "Two-level i18n store and locale resolution for Sova"
license = "MIT"
repository = "https://github.com/s00d/sova"
homepage = "https://s00d.github.io/sova/"
documentation = "https://docs.rs/sova-i18n"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = []
cookie = ["dep:sova-cookies"]
watch = ["dep:notify"]
templates = ["dep:sova-templates"]

[dependencies]
sova-core = { workspace = true }
sova-cookies = { workspace = true, optional = true }
sova-templates = { workspace = true, optional = true }
minijinja = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytes = { workspace = true }
arc-swap = { workspace = true }
tracing = { workspace = true }
http = { workspace = true }
notify = { workspace = true, optional = true, default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
http = { workspace = true }
sova-core = { workspace = true, features = ["testing"] }
sova-cookies = { workspace = true }
sova-openapi = { workspace = true }
sova-templates = { workspace = true }
