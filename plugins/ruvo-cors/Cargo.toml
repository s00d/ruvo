[package]
name = "ruvo-cors"
version = "0.1.0"
edition = "2021"
description = "CORS plugin for Ruvo"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-cors"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
ruvo-core = { workspace = true }
toml = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

