[package]
name = "ruvo-udp"
version = "0.4.0"
edition = "2021"
description = "UDP BackgroundService helpers for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
ruvo-core = { workspace = true, features = ["testing"] }
