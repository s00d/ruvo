[package]
name = "ruvo-udp"
version = "0.4.0"
edition = "2021"
description = "UDP BackgroundService helpers for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
tokio = { version = "1", features = ["net", "sync", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
ruvo-core = { path = "../../crates/ruvo-core", features = ["testing"] }
