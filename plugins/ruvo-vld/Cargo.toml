[package]
name = "ruvo-vld"
version = "0.4.0"
edition = "2021"
description = "vld validation integration for Ruvo"
license = "MIT"
publish = false

[features]
default = []
openapi = ["dep:ruvo-openapi", "vld/openapi"]
flash = ["dep:ruvo-session"]
flash-templates = ["flash", "dep:ruvo-templates", "dep:minijinja"]
form = ["dep:ruvo-multipart"]
i18n = ["dep:ruvo-i18n"]

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
ruvo-openapi = { path = "../ruvo-openapi", optional = true }
ruvo-session = { path = "../ruvo-session", optional = true }
ruvo-multipart = { path = "../ruvo-multipart", optional = true }
ruvo-i18n = { path = "../ruvo-i18n", optional = true }
ruvo-templates = { path = "../ruvo-templates", optional = true }
minijinja = { version = "2", optional = true }
vld = { version = "0.4", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_qs = "0.13"
bytes = "1"
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
http = "1"
bytes = "1"
ruvo-openapi = { path = "../ruvo-openapi" }
ruvo-core = { path = "../../crates/ruvo-core", features = ["testing"] }
ruvo-multipart = { path = "../ruvo-multipart" }
ruvo-session = { path = "../ruvo-session" }
vld = { version = "0.4", features = ["serialize", "openapi"] }
