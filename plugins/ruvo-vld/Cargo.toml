[package]
name = "ruvo-vld"
version = "0.1.0"
edition = "2021"
description = "vld validation integration for Ruvo"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-vld"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = []
openapi = ["dep:ruvo-openapi", "vld/openapi"]
flash = ["dep:ruvo-session"]
flash-templates = ["flash", "dep:ruvo-templates", "dep:minijinja"]
form = ["ruvo-core/multipart"]
i18n = ["dep:ruvo-i18n"]

[dependencies]
ruvo-core = { workspace = true }
ruvo-openapi = { workspace = true, optional = true }
ruvo-session = { workspace = true, optional = true }
ruvo-i18n = { workspace = true, optional = true }
ruvo-templates = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
vld = { workspace = true, features = ["serialize"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_qs = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http = { workspace = true }
bytes = { workspace = true }
ruvo-openapi = { workspace = true }
ruvo-core = { workspace = true, features = ["testing", "multipart"] }
ruvo-session = { workspace = true }
ruvo-templates = { workspace = true }
tempfile = { workspace = true }
vld = { workspace = true, features = ["serialize", "openapi"] }
minijinja = { workspace = true }

[[test]]
name = "validate"
required-features = ["openapi", "form", "flash"]

[[test]]
name = "flash_templates"
required-features = ["flash-templates"]
