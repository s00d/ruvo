[package]
name = "ruvo-vld"
version = "0.4.0"
edition = "2021"
description = "vld validation integration for Ruvo"
license = "MIT"
publish = false

[features]
default = []
openapi = ["dep:ruvo-openapi", "vld/openapi"]
flash = ["dep:ruvo-session"]
flash-templates = ["flash", "dep:ruvo-templates", "dep:minijinja"]
form = ["ruvo-core/multipart"]
i18n = ["dep:ruvo-i18n"]

[dependencies]
ruvo-core = { workspace = true }
ruvo-openapi = { path = "../ruvo-openapi", optional = true }
ruvo-session = { path = "../ruvo-session", optional = true }
ruvo-i18n = { path = "../ruvo-i18n", optional = true }
ruvo-templates = { path = "../ruvo-templates", optional = true }
minijinja = { workspace = true, optional = true }
vld = { workspace = true, features = ["serialize"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_qs = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http = { workspace = true }
bytes = { workspace = true }
ruvo-openapi = { path = "../ruvo-openapi" }
ruvo-core = { workspace = true, features = ["testing", "multipart"] }
ruvo-session = { path = "../ruvo-session" }
ruvo-templates = { path = "../ruvo-templates" }
tempfile = { workspace = true }
vld = { workspace = true, features = ["serialize", "openapi"] }
minijinja = { workspace = true }

[[test]]
name = "validate"
required-features = ["openapi", "form", "flash"]

[[test]]
name = "flash_templates"
required-features = ["flash-templates"]
