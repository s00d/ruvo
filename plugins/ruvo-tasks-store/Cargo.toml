[package]
name = "ruvo-tasks-store"
version = "0.4.0"
edition = "2021"
description = "TaskStore trait + memory backend (unstable until Postgres freeze)"
license = "MIT"
publish = false

[features]
default = ["unstable-store"]
unstable-store = []

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
