[package]
name = "ruvo-tasks-store"
version = "0.4.0"
edition = "2021"
description = "TaskStore trait + memory / file / sql / redis backends"
license = "MIT"
publish = false

[features]
default = ["unstable-store"]
unstable-store = []
file = ["tokio/fs", "tokio/io-util", "dep:serde", "dep:serde_json"]
sql = ["dep:ruvo-db", "dep:chrono", "dep:sea-orm"]
redis = ["dep:ruvo-redis", "dep:serde", "dep:serde_json", "dep:redis", "dep:base64"]

[dependencies]
bytes = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ruvo-db = { workspace = true, optional = true, default-features = false }
ruvo-redis = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
redis = { workspace = true, optional = true, features = ["script"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
ruvo-db = { workspace = true, default-features = false, features = ["sqlite"] }
