[package]
name = "sova-meta"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
description = "Document meta, OG/Twitter, JSON-LD, sitemap and robots for Sova"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-meta"
readme = "README.md"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = []
templates = ["dep:sova-templates", "dep:minijinja"]
i18n = ["dep:sova-i18n"]
store = ["dep:sova-store"]
openapi = ["dep:sova-openapi"]

[dependencies]
sova-core = { workspace = true }
sova-templates = { workspace = true, optional = true }
sova-i18n = { workspace = true, optional = true }
sova-store = { workspace = true, optional = true }
sova-openapi = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
sova-core = { workspace = true, features = ["testing"] }
sova-openapi = { workspace = true }
sova-i18n = { workspace = true }
sova-store = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
