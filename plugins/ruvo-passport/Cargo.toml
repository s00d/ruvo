[package]
name = "ruvo-passport"
version = "0.4.0"
edition = "2021"
description = "Passport-style authentication for Ruvo (strategies, JWT, OAuth2, sessions)"
license = "MIT"
publish = false

[features]
default = []
# Session serialize/deserialize + login/logout (needs ruvo-session).
session = ["dep:ruvo-session"]
# JWT users/refresh/migrate. Facade: `passport-jwt`.
jwt = [
    "dep:jsonwebtoken",
    "dep:getrandom",
    "dep:ruvo-db",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:async-trait",
    "dep:argon2",
    "dep:password-hash",
    "dep:rand_core",
    "dep:sha2",
    "dep:chrono",
]
# OAuth2 login. Facade: `passport-oauth`.
oauth = [
    "jwt",
    "dep:reqwest",
    "dep:serde_json",
    "dep:url",
    "dep:base64",
    "dep:hmac",
]

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
http = "1"
serde = { version = "1", features = ["derive"] }
ruvo-session = { path = "../ruvo-session", optional = true }
jsonwebtoken = { version = "9", optional = true }
ruvo-db = { path = "../ruvo-db", optional = true }
sea-orm = { version = "2.0", optional = true, default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0", optional = true, default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
async-trait = { version = "0.1", optional = true }
argon2 = { version = "0.5", optional = true }
password-hash = { version = "0.5", optional = true }
rand_core = { version = "0.6", optional = true, features = ["std"] }
getrandom = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
hmac = { version = "0.12", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
ruvo-session = { path = "../ruvo-session" }
ruvo-cookies = { path = "../ruvo-cookies" }
