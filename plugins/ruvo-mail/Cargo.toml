[package]
name = "ruvo-mail"
version = "0.4.0"
edition = "2021"
description = "Outbound email for Ruvo (lettre SMTP / fake / file)"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { workspace = true }
ruvo-templates = { path = "../ruvo-templates", optional = true }
lettre = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }

[features]
default = []
templates = ["dep:ruvo-templates", "dep:serde", "dep:serde_json"]
markdown = ["dep:pulldown-cmark"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
tempfile = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
ruvo-templates = { path = "../ruvo-templates" }
ruvo-core = { workspace = true, features = ["testing"] }
