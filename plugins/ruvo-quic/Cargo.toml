[package]
name = "ruvo-quic"
version = "0.4.0"
edition = "2021"
description = "QUIC datagrams BackgroundService helpers for Ruvo"
license = "MIT"
publish = false

[features]
dev-tls = ["ruvo-core/dev-tls"]

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core", features = ["tls"] }
tokio = { version = "1", features = ["net", "sync", "rt", "macros", "time"] }
tracing = "0.1"

bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

quinn = { version = "0.11", features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tempfile = "3"
rcgen = "0.13"
rustls-pemfile = "2"
ruvo-core = { path = "../../crates/ruvo-core", features = ["testing"] }

