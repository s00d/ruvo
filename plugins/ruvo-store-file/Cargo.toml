[package]
name = "ruvo-store-file"
version = "0.4.0"
edition = "2021"
description = "File-backed KvStore: RAM HashMap + append log + snapshot"
license = "MIT"
publish = false

[dependencies]
bytes = "1"
ruvo-store = { path = "../ruvo-store" }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
