[package]
name = "ruvo-tasks-sqlite"
version = "0.4.0"
edition = "2021"
description = "SQLite TaskStore (serialized claim; no SKIP LOCKED)"
license = "MIT"
publish = false

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ruvo-tasks-store = { path = "../ruvo-tasks-store" }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
