[package]
name = "ruvo-store-postgres"
version = "0.4.0"
edition = "2021"
description = "Postgres-backed KvStore using sqlx"
license = "MIT"
publish = false

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ruvo-db = { path = "../ruvo-db" }
ruvo-store = { path = "../ruvo-store" }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "chrono"] }
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
