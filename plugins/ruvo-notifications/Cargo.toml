[package]
name = "ruvo-notifications"
version = "0.1.0"
edition = "2021"
description = "Database notifications with channels, ACL, optional WS/mail"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-notifications"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = []
ws = ["dep:ruvo-ws"]
mail = ["dep:ruvo-mail"]
auth = ["dep:ruvo-auth"]
templates = ["dep:ruvo-templates", "dep:minijinja"]

[dependencies]
ruvo-core = { workspace = true }
ruvo-db = { workspace = true }
ruvo-ws = { workspace = true, optional = true }
ruvo-mail = { workspace = true, optional = true }
ruvo-auth = { workspace = true, optional = true }
ruvo-templates = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
sea-orm = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { workspace = true, default-features = false, features = ["runtime-tokio-rustls"] }
async-trait = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "std", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
ruvo-core = { workspace = true, features = ["testing"] }
ruvo-db = { workspace = true, features = ["sqlite"] }
ruvo-testing = { workspace = true, features = ["sqlite", "notifications", "auth"] }
ruvo-auth = { workspace = true }
ruvo-session = { workspace = true }
ruvo-mail = { workspace = true }
sea-orm = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros", "with-chrono"] }
sea-orm-migration = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
serde_json = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }
