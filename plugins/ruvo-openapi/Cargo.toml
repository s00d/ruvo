[package]
name = "ruvo-openapi"
version = "0.4.0"
edition = "2021"
description = "OpenAPI document generation and /docs UI for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
ruvo-core = { workspace = true, features = ["testing"] }
