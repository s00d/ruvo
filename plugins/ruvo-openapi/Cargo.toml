[package]
name = "ruvo-openapi"
version = "0.1.0"
edition = "2021"
description = "OpenAPI document generation and /docs UI for Ruvo"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-openapi"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
ruvo-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
ruvo-core = { workspace = true, features = ["testing"] }
