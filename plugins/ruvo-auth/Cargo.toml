[package]
name = "ruvo-auth"
version = "0.1.0"
edition = "2021"
description = "Fortify-style authentication for Ruvo (register, 2FA, reset, roles)"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-auth"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = []
vld = ["dep:ruvo-vld", "dep:vld", "ruvo-vld/form", "ruvo-vld/flash", "ruvo-vld/openapi", "vld/openapi"]
activity = ["dep:ruvo-activity"]
templates = ["ruvo-mail/templates", "dep:ruvo-templates"]

[dependencies]
ruvo-core = { workspace = true, features = ["multipart"] }
ruvo-db = { workspace = true }
ruvo-passport = { workspace = true, features = ["jwt", "session"] }
ruvo-mail = { workspace = true }
ruvo-templates = { workspace = true, optional = true }
ruvo-session = { workspace = true }
ruvo-rate-limit = { workspace = true }
ruvo-activity = { workspace = true, optional = true }
ruvo-vld = { workspace = true, optional = true, features = ["form", "flash"] }
vld = { workspace = true, optional = true, features = ["serialize"] }
sea-orm = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { workspace = true, default-features = false, features = ["runtime-tokio-rustls"] }
async-trait = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "std", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
totp-rs = { workspace = true, features = ["gen_secret", "otpauth"] }
urlencoding = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
ruvo-core = { workspace = true, features = ["testing", "multipart"] }
ruvo-db = { workspace = true, features = ["sqlite"] }
ruvo-testing = { workspace = true, features = ["sqlite", "auth"] }
ruvo-session = { workspace = true }
ruvo-csrf = { workspace = true }
ruvo-mail = { workspace = true }
ruvo-activity = { workspace = true }
ruvo-vld = { workspace = true, features = ["form", "flash"] }
vld = { workspace = true, features = ["serialize"] }
sea-orm = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros", "with-chrono"] }
sea-orm-migration = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
serde_json = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }
totp-rs = { workspace = true, features = ["gen_secret", "otpauth"] }
