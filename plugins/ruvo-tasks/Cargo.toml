[package]
name = "ruvo-tasks"
version = "0.1.0"
edition = "2021"
description = "Task worker / scheduler / HTTP enqueue for Ruvo"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-tasks"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
bytes = { workspace = true }
ruvo-core = { workspace = true }
ruvo-tasks-store = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cron = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
http = { workspace = true }
ruvo-core = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
