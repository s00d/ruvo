[package]
name = "ruvo-tasks"
version = "0.4.0"
edition = "2021"
description = "Task worker / scheduler / HTTP enqueue for Ruvo"
license = "MIT"
publish = false

[dependencies]
bytes = "1"
ruvo-core = { path = "../../crates/ruvo-core" }
ruvo-tasks-store = { path = "../ruvo-tasks-store" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
http = "1"
ruvo-core = { path = "../../crates/ruvo-core", features = ["testing"] }
serde_json = "1"
