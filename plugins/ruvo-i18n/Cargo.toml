[package]
name = "ruvo-i18n"
version = "0.4.0"
edition = "2021"
description = "Two-level i18n store and locale resolution for Ruvo"
license = "MIT"
publish = false

[features]
default = []
cookie = ["dep:ruvo-cookies"]
watch = ["dep:notify"]
templates = ["dep:ruvo-templates"]

[dependencies]
ruvo-core = { workspace = true }
ruvo-cookies = { path = "../ruvo-cookies", optional = true }
ruvo-templates = { path = "../ruvo-templates", optional = true }
minijinja = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytes = { workspace = true }
arc-swap = { workspace = true }
tracing = { workspace = true }
http = { workspace = true }
notify = { workspace = true, optional = true, default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
http = { workspace = true }
ruvo-core = { workspace = true, features = ["testing"] }
ruvo-cookies = { path = "../ruvo-cookies" }
ruvo-openapi = { path = "../ruvo-openapi" }
ruvo-templates = { path = "../ruvo-templates" }
