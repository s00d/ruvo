[package]
name = "ruvo-i18n"
version = "0.4.0"
edition = "2021"
description = "Two-level i18n store and locale resolution for Ruvo"
license = "MIT"
publish = false

[features]
default = []
cookie = ["dep:ruvo-cookies"]
watch = ["dep:notify"]

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
ruvo-cookies = { path = "../ruvo-cookies", optional = true }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
arc-swap = "1"
tracing = "0.1"
http = "1"
notify = { version = "6", optional = true, default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
http = "1"
ruvo-core = { path = "../../crates/ruvo-core", features = ["testing"] }
ruvo-cookies = { path = "../ruvo-cookies" }
ruvo-openapi = { path = "../ruvo-openapi" }
ruvo-templates = { path = "../ruvo-templates" }
