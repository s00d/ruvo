[package]
name = "sova-udp"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
description = "UDP BackgroundService helpers for Sova"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-udp"
readme = "README.md"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
sova-core = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
sova-core = { workspace = true, features = ["testing"] }
