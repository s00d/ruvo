[package]
name = "sova-notifications"
version = "0.1.4"
authors.workspace = true
edition.workspace = true
description = "Database notifications with channels, ACL, optional WS/mail"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-notifications"
readme = "README.md"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = []
ws = ["dep:sova-ws"]
mail = ["dep:sova-mail"]
auth = ["dep:sova-auth"]
templates = ["dep:sova-templates", "dep:minijinja"]
testing = ["sova-core/testing"]

[dependencies]
sova-core = { workspace = true }
sova-db = { workspace = true }
sova-ws = { workspace = true, optional = true }
sova-mail = { workspace = true, optional = true }
sova-auth = { workspace = true, optional = true }
sova-templates = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
sea-orm = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { workspace = true, default-features = false, features = ["runtime-tokio-rustls"] }
async-trait = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "std", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
sova-notifications = { path = ".", features = ["testing"] }
sova-core = { workspace = true, features = ["testing"] }
sova-db = { workspace = true, features = ["sqlite"] }
sova-testing = { workspace = true, features = ["sqlite"] }
sova-auth = { workspace = true, features = ["testing"] }
sova-session = { workspace = true }
sova-mail = { workspace = true }
sea-orm = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros", "with-chrono"] }
sea-orm-migration = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
serde_json = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }
