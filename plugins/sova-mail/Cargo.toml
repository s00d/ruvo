[package]
name = "sova-mail"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
description = "Outbound email for Sova (lettre SMTP / fake / file)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-mail"
readme = "README.md"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
sova-core = { workspace = true }
sova-templates = { workspace = true, optional = true }
lettre = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }

[features]
default = []
templates = ["dep:sova-templates", "dep:serde", "dep:serde_json"]
markdown = ["dep:pulldown-cmark"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
tempfile = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
sova-templates = { workspace = true }
sova-core = { workspace = true, features = ["testing"] }
