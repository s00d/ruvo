[package]
name = "ruvo-templates"
version = "0.4.0"
edition = "2021"
description = "Template engine plugin for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja-autoreload = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
http = "1"
