[package]
name = "sova-passport"
version = "0.1.1"
edition = "2021"
description = "Passport-style authentication for Sova (strategies, JWT, OAuth2, sessions)"
license = "MIT"
repository = "https://github.com/s00d/sova"
homepage = "https://s00d.github.io/sova/"
documentation = "https://docs.rs/sova-passport"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = []
# Session serialize/deserialize + login/logout (needs sova_session).
session = ["dep:sova-session"]
# JWT users/refresh/migrate. Facade: `passport-jwt`.
jwt = [
    "dep:jsonwebtoken",
    "dep:getrandom",
    "dep:sova-db",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:async-trait",
    "dep:argon2",
    "dep:password-hash",
    "dep:rand_core",
    "dep:sha2",
    "dep:chrono",
    "dep:serde_json",
]
# OAuth2 login. Facade: `passport-oauth`.
oauth = [
    "jwt",
    "dep:reqwest",
    "dep:serde_json",
    "dep:url",
    "dep:base64",
    "dep:hmac",
]

[dependencies]
sova-core = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sova-session = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
sova-db = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true, default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { workspace = true, optional = true, default-features = false, features = ["runtime-tokio-rustls"] }
async-trait = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
password-hash = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true, features = ["std"] }
getrandom = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true, default-features = false, features = ["clock", "std", "serde"] }
reqwest = { workspace = true, optional = true, default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true, optional = true }
url = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
jsonwebtoken = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "std"] }
sova-core = { workspace = true, features = ["testing"] }
sova-testing = { workspace = true, features = ["sqlite"] }
sova-session = { workspace = true }
sova-cookies = { workspace = true }
sova-db = { workspace = true, features = ["sqlite"] }
sea-orm = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros", "with-chrono"] }
sea-orm-migration = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
tempfile = { workspace = true }
http = { workspace = true }

[[test]]
name = "jwt_auth"
required-features = ["jwt"]

[[test]]
name = "api_tokens"
required-features = ["jwt"]
