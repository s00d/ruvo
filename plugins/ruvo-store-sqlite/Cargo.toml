[package]
name = "ruvo-store-sqlite"
version = "0.4.0"
edition = "2021"
description = "SQLite-backed KvStore using sqlx"
license = "MIT"
publish = false

[dependencies]
bytes = "1"
ruvo-store = { path = "../ruvo-store" }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
