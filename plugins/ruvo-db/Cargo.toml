[package]
name = "ruvo-db"
version = "0.4.0"
edition = "2021"
description = "SeaORM database plugin for Ruvo (postgres / sqlite / mysql)"
license = "MIT"
publish = false

[features]
default = ["postgres"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
sea-orm = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls"] }
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
http = "1"
