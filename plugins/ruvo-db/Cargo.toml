[package]
name = "ruvo-db"
version = "0.4.0"
edition = "2021"
description = "SeaORM Postgres integration for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
http = "1"
