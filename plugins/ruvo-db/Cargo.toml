[package]
name = "ruvo-db"
version = "0.4.0"
edition = "2021"
description = "SeaORM database plugin for Ruvo (postgres / sqlite / mysql)"
license = "MIT"
publish = false

[features]
default = ["postgres"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]

[dependencies]
ruvo-core = { workspace = true }
sea-orm = { workspace = true, features = ["macros"] }
sea-orm-migration = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http = { workspace = true }
tempfile = { workspace = true }
ruvo-core = { workspace = true, features = ["testing"] }

[[test]]
name = "sqlite"
required-features = ["sqlite"]
