[package]
name = "ruvo-compress"
version = "0.4.0"
edition = "2021"
description = "Response compression plugin for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { workspace = true }
async-compression = { workspace = true, features = ["tokio", "gzip", "deflate", "brotli"] }
bytes = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http-body-util = { workspace = true }
