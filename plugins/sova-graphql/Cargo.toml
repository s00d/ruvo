[package]
name = "sova-graphql"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
description = "GraphQL client (+ optional schema mount) for Sova"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-graphql"
readme = "README.md"
keywords = ["http", "web", "framework", "async", "graphql"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = ["client"]
# Outbound GraphQL client (primary).
client = ["dep:reqwest"]
# Mount async-graphql schema as HTTP endpoint (optional server).
server = [
    "dep:async-graphql",
    "async-graphql/graphiql",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tracing",
]

[dependencies]
sova-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, optional = true, default-features = false, features = ["json", "rustls-tls"] }
async-graphql = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "macros"] }
tokio-tungstenite = { workspace = true, optional = true, default-features = false, features = ["connect"] }
futures-util = { workspace = true, optional = true, default-features = false, features = ["sink", "std"] }
hyper = { workspace = true, optional = true, features = ["server"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
sova-core = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
async-graphql = { workspace = true, features = ["graphiql"] }
tokio-tungstenite = { workspace = true, default-features = false, features = ["connect"] }
futures-util = { workspace = true, default-features = false, features = ["std"] }

[[test]]
name = "server"
path = "tests/server.rs"
required-features = ["server"]

[[test]]
name = "composite"
path = "tests/composite.rs"
required-features = ["server"]

[[test]]
name = "context"
path = "tests/context.rs"
required-features = ["server"]

[[test]]
name = "subscription"
path = "tests/subscription.rs"
required-features = ["server"]
