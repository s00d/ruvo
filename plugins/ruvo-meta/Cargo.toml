[package]
name = "ruvo-meta"
version = "0.1.0"
edition = "2021"
description = "Document meta, OG/Twitter, JSON-LD, sitemap and robots for Ruvo"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-meta"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = ["openapi"]
templates = ["dep:ruvo-templates", "dep:minijinja"]
i18n = ["dep:ruvo-i18n"]
store = ["dep:ruvo-store"]
openapi = ["dep:ruvo-openapi"]

[dependencies]
ruvo-core = { workspace = true }
ruvo-templates = { workspace = true, optional = true }
ruvo-i18n = { workspace = true, optional = true }
ruvo-store = { workspace = true, optional = true }
ruvo-openapi = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
ruvo-core = { workspace = true, features = ["testing"] }
ruvo-openapi = { workspace = true }
ruvo-i18n = { workspace = true }
ruvo-store = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
