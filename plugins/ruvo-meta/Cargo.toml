[package]
name = "ruvo-meta"
version = "0.4.0"
edition = "2021"
description = "Document meta, OG/Twitter, JSON-LD, sitemap and robots for Ruvo"
license = "MIT"
publish = false

[features]
default = ["openapi"]
templates = ["dep:ruvo-templates", "dep:minijinja"]
i18n = ["dep:ruvo-i18n"]
store = ["dep:ruvo-store"]
openapi = ["dep:ruvo-openapi"]

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
ruvo-templates = { path = "../ruvo-templates", optional = true }
ruvo-i18n = { path = "../ruvo-i18n", optional = true }
ruvo-store = { path = "../ruvo-store", optional = true }
ruvo-openapi = { path = "../ruvo-openapi", optional = true }
minijinja = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
bytes = "1"
tracing = "0.1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "time"] }
ruvo-core = { path = "../../crates/ruvo-core", features = ["testing"] }
ruvo-openapi = { path = "../ruvo-openapi" }
ruvo-i18n = { path = "../ruvo-i18n" }
ruvo-store = { path = "../ruvo-store" }
tempfile = "3"
serde_json = "1"
http = "1"
