[package]
name = "ruvo-meta"
version = "0.4.0"
edition = "2021"
description = "Document meta, OG/Twitter, JSON-LD, sitemap and robots for Ruvo"
license = "MIT"
publish = false

[features]
default = ["openapi"]
templates = ["dep:ruvo-templates", "dep:minijinja"]
i18n = ["dep:ruvo-i18n"]
store = ["dep:ruvo-store"]
openapi = ["dep:ruvo-openapi"]

[dependencies]
ruvo-core = { workspace = true }
ruvo-templates = { path = "../ruvo-templates", optional = true }
ruvo-i18n = { path = "../ruvo-i18n", optional = true }
ruvo-store = { workspace = true, optional = true }
ruvo-openapi = { path = "../ruvo-openapi", optional = true }
minijinja = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
ruvo-core = { workspace = true, features = ["testing"] }
ruvo-openapi = { path = "../ruvo-openapi" }
ruvo-i18n = { path = "../ruvo-i18n" }
ruvo-store = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
