[package]
name = "ruvo-rate-limit"
version = "0.4.0"
edition = "2021"
description = "Rate limit plugin for Ruvo (local sliding + shared fixed window)"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
ruvo-store = { path = "../ruvo-store" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
http = "1"
