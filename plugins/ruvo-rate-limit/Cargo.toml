[package]
name = "ruvo-rate-limit"
version = "0.1.0"
edition = "2021"
description = "Rate limit plugin for Ruvo (local sliding + shared fixed window)"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-rate-limit"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
ruvo-core = { workspace = true }
ruvo-store = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
ruvo-core = { workspace = true, features = ["testing", "multipart"] }
http = { workspace = true }
serde_json = { workspace = true }
