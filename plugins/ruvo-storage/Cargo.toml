[package]
name = "ruvo-storage"
version = "0.4.0"
edition = "2021"
description = "Object storage for Ruvo (local / memory / S3 / GCS / Azure)"
license = "MIT"
publish = false

[features]
default = ["local", "memory"]
local = []
memory = []
s3 = ["dep:opendal", "opendal/services-s3"]
gcs = ["dep:opendal", "opendal/services-gcs"]
azure = ["dep:opendal", "opendal/services-azblob"]

[dependencies]
ruvo-core = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt", "macros"] }
thiserror = { workspace = true }
opendal = { workspace = true, optional = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
ruvo-core = { workspace = true, features = ["testing"] }
