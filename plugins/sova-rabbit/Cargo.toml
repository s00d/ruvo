[package]
name = "sova-rabbit"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "RabbitMQ / AMQP broker plugin for Sova (raw publish/consume + fake)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-rabbit"
readme = "README.md"
keywords = ["amqp", "rabbitmq", "queue", "async"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["lapin"]
lapin = ["dep:lapin"]

[dependencies]
sova-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
futures-util = { workspace = true, default-features = false, features = ["std"] }
lapin = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
sova-core = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
