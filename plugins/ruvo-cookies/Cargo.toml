[package]
name = "ruvo-cookies"
version = "0.4.0"
edition = "2021"
description = "Cookie parsing plugin for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { workspace = true }
cookie = { workspace = true, features = ["percent-encode"] }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
cookie = { workspace = true, features = ["percent-encode"] }
