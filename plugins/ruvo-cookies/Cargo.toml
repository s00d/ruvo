[package]
name = "ruvo-cookies"
version = "0.4.0"
edition = "2021"
description = "Cookie parsing plugin for Ruvo"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { path = "../../crates/ruvo-core" }
cookie = { version = "0.18", features = ["percent-encode"] }
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
