[package]
name = "ruvo-cookies"
version = "0.1.0"
edition = "2021"
description = "Cookie parsing plugin for Ruvo"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-cookies"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
ruvo-core = { workspace = true }
cookie = { workspace = true, features = ["percent-encode"] }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
cookie = { workspace = true, features = ["percent-encode"] }
