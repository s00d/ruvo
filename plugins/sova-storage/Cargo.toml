[package]
name = "sova-storage"
version = "0.1.0"
edition = "2021"
description = "Object storage for Sova (local / memory / S3 / GCS / Azure)"
license = "MIT"
repository = "https://github.com/s00d/sova"
homepage = "https://s00d.github.io/sova/"
documentation = "https://docs.rs/sova-storage"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = ["local", "memory"]
local = []
memory = []
s3 = ["dep:opendal", "opendal/services-s3"]
gcs = ["dep:opendal", "opendal/services-gcs"]
azure = ["dep:opendal", "opendal/services-azblob"]

[dependencies]
sova-core = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt", "macros"] }
thiserror = { workspace = true }
opendal = { workspace = true, optional = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
sova-core = { workspace = true, features = ["testing"] }
