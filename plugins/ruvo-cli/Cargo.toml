[package]
name = "ruvo-cli"
version = "0.4.0"
edition = "2021"
description = "CLI ServerArgs / listen_args for Ruvo (local dev)"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
clap = { workspace = true, features = ["derive", "env"] }
