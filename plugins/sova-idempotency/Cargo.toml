[package]
name = "sova-idempotency"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
description = "Inbound Idempotency-Key middleware for Sova"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-idempotency"
readme = "README.md"
keywords = ["http", "web", "framework", "async", "idempotency"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
sova-core = { workspace = true }
sova-store = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
sova-core = { workspace = true, features = ["testing"] }
http = { workspace = true }
