[package]
name = "sova-observability"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
description = "Request metrics (Prometheus), OpenTelemetry, and Elasticsearch logs for Sova"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sova-observability"
readme = "README.md"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = ["prometheus"]
prometheus = ["dep:metrics", "dep:metrics-exporter-prometheus"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
elasticsearch = ["dep:reqwest", "dep:serde_json", "dep:chrono", "dep:tokio"]

[dependencies]
sova-core = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true, default-features = false }
opentelemetry = { workspace = true, optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { workspace = true, optional = true, default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { workspace = true, optional = true, default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, default-features = false, features = ["registry", "std"] }
reqwest = { workspace = true, optional = true, default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http = { workspace = true }
sova-core = { workspace = true, features = ["testing"] }
