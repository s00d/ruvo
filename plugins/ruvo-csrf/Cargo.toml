[package]
name = "ruvo-csrf"
version = "0.4.0"
edition = "2021"
description = "CSRF protection plugin for Ruvo (session double-submit)"
license = "MIT"
publish = false

[dependencies]
ruvo-core = { workspace = true }
ruvo-session = { path = "../ruvo-session" }
ruvo-cookies = { path = "../ruvo-cookies" }
getrandom = { workspace = true }
http = { workspace = true }
serde_urlencoded = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http = { workspace = true }
ruvo-cookies = { path = "../ruvo-cookies" }
ruvo-store = { workspace = true }
ruvo-session = { path = "../ruvo-session" }
