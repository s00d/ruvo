[package]
name = "ruvo-csrf"
version = "0.1.0"
edition = "2021"
description = "CSRF protection plugin for Ruvo (session double-submit)"
license = "MIT"
repository = "https://github.com/s00d/ruvo"
homepage = "https://s00d.github.io/ruvo/"
documentation = "https://docs.rs/ruvo-csrf"
keywords = ["http", "web", "framework", "async"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
ruvo-core = { workspace = true }
ruvo-session = { workspace = true }
ruvo-cookies = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
serde_urlencoded = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http = { workspace = true }
ruvo-cookies = { workspace = true }
ruvo-store = { workspace = true }
ruvo-session = { workspace = true }
