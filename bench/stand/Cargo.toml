[workspace]
resolver = "2"
members = [
    "crates/stand_fixtures",
    "crates/stand_ruvo",
    "crates/stand_axum",
    "crates/stand_actix",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
stand_fixtures = { path = "crates/stand_fixtures" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
actix-web = "4"
ruvo = { path = "../../crates/ruvo", default-features = false, features = [] }
