[workspace]
resolver = "2"
members = [
    "crates/stand_fixtures",
    "crates/stand_sova",
    "crates/stand_axum",
    "crates/stand_actix",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
stand_fixtures = { path = "crates/stand_fixtures" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
actix-web = "4"
sova = { path = "../../crates/sova", default-features = false, features = [] }
