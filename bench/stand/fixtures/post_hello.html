<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello — Bench Stand</title>
  <style>
    :root { color-scheme: light; --fg:#134e4a; --muted:#0f766e; --bg:#f0fdfa; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; color:var(--fg); background:var(--bg); }
    header { display:flex; gap:1.5rem; align-items:center; padding:1rem 1.5rem; background:#fff; border-bottom:1px solid #99f6e4; }
    header a { color:var(--muted); text-decoration:none; font-weight:600; }
    header a:hover { text-decoration:underline; }
    main { max-width:40rem; margin:2rem auto; padding:0 1.5rem; }
    h1 { font-size:1.75rem; margin:0 0 .75rem; }
    p { line-height:1.55; }
    footer { margin-top:3rem; color:#5eead4; font-size:.875rem; }
  </style>
</head>
<body>
  <header>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/blog">Blog</a>
    <a href="/contact">Contact</a>
  </header>
  <main>
    <h1>Hello from the stand</h1>
    <p>A single blog post fixture so routing with a path parameter is exercised the same way everywhere.</p>
    <p>Payload marker: STAND_POST_HELLO_V1</p>
  </main>
  <footer>
    <main>bench/stand fixtures</main>
  </footer>
</body>
</html>
